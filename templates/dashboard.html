<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Rex Trader</title>
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #000000;
      --panel: #0a0a0a;
      --panel-2: #131313;
      --border: #1f1f1f;
      --text: #f4f4f5;
      --muted: #94a3b8;
      --dim: #525c6b;

      /* Neon orange — Rex brand */
      --accent: #ff6b00;
      --accent-bright: #ff8520;
      --accent-dim: rgba(255, 107, 0, 0.14);
      --accent-glow: rgba(255, 107, 0, 0.45);

      /* Electric blue — secondary accent */
      --info: #00d9ff;
      --info-dim: rgba(0, 217, 255, 0.12);

      --buy: #4ade80;
      --sell: #f87171;
      --hold: #94a3b8;
      --warn: #fbbf24;

      --shortEMA: #ff6b00;
      --longEMA:  #00d9ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      height: 100%; overflow: hidden; }
    .app { height: 100vh; display: flex; flex-direction: column; padding: 20px; gap: 14px; }

    /* Top bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center;
      gap: 16px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; }
    h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .badge.paper { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(255, 107, 0, 0.3); }
    .badge.spot  { background: var(--info-dim); color: var(--info); border: 1px solid rgba(0, 217, 255, 0.3); }
    .badge.signal-buy  { background: rgba(74, 222, 128, 0.12); color: var(--buy); }
    .badge.signal-sell { background: rgba(248, 113, 113, 0.12); color: var(--sell); }
    .badge.signal-hold { background: rgba(138, 150, 163, 0.12); color: var(--muted); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 8px var(--accent-glow);
      animation: pulse 2s infinite; }
    .logo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
      box-shadow: 0 0 14px var(--accent-glow); border: 1px solid rgba(255, 107, 0, 0.4); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .countdown { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

    /* Money strip */
    .money { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 16px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 24px; align-items: center; }
    .money-block { display: flex; flex-direction: column; gap: 4px; }
    .money-block.equity { border-right: 1px solid var(--border); padding-right: 16px; }
    .money-label { font-size: 10px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
    .money-value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em; line-height: 1.1; }
    .money-value.equity { font-size: 44px; color: var(--accent);
      text-shadow: 0 0 18px rgba(255, 107, 0, 0.35); }
    .money-sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .money-sub.pos { color: var(--buy); }
    .money-sub.neg { color: var(--sell); }

    /* Chart container — takes all remaining height */
    .chart-wrap { flex: 1; background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 20px 12px; display: flex; flex-direction: column;
      min-height: 0; }
    .chart-head { display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; gap: 12px; flex-wrap: wrap; }
    .chart-title { font-size: 12px; color: var(--muted); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em; }
    .timeframes { display: flex; gap: 6px; }
    .tf { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-size: 11px;
      font-weight: 600; letter-spacing: 0.04em; cursor: pointer;
      transition: all 0.15s ease; font-family: inherit; }
    .tf:hover { color: var(--text); border-color: var(--accent); }
    .tf.active { background: var(--accent-dim); color: var(--accent);
      border-color: rgba(255, 107, 0, 0.5); text-shadow: 0 0 8px var(--accent-glow); }
    .legend { display: flex; gap: 14px; font-size: 11px; }
    .legend-item { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .swatch { width: 14px; height: 2px; border-radius: 1px; }
    .swatch.dot { width: 10px; height: 10px; border-radius: 50%; animation: none; }
    canvas { width: 100%; flex: 1; min-height: 0; display: block; }

    /* Footer */
    .footer { display: flex; justify-content: space-between; flex-wrap: wrap;
      gap: 12px; color: var(--dim); font-size: 11px; padding: 0 4px; }
    .footer b { color: var(--muted); font-weight: 500; }
    .footer .ok { color: var(--accent); }
    .chart-wrap { box-shadow: 0 0 32px rgba(255, 107, 0, 0.04); }
    h1 { background: linear-gradient(90deg, var(--accent) 0%, var(--info) 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; }
  </style>
</head>
<body>
  <div class="app">

    <div class="top-bar">
      <div class="brand">
        <img src="/static/logo.png" alt="Rex" class="logo" />
        <h1>Rex Trader</h1>
        <span class="dot"></span>
        <span class="badge paper" id="mode-badge">PAPER</span>
        <span class="badge spot">SPOT · NO LEVERAGE</span>
        <span class="badge signal-hold" id="signal-badge">HOLD</span>
      </div>
      <div class="countdown" id="countdown">next check in —</div>
    </div>

    <div class="money">
      <div class="money-block equity">
        <span class="money-label">Equity (paper $)</span>
        <span class="money-value equity" id="equity">—</span>
        <span class="money-sub" id="equity-delta">since start —</span>
      </div>
      <div class="money-block">
        <span class="money-label">Cash</span>
        <span class="money-value" id="cash">—</span>
        <span class="money-sub" id="cash-sub">unused</span>
      </div>
      <div class="money-block">
        <span class="money-label">Position</span>
        <span class="money-value" id="position">—</span>
        <span class="money-sub" id="position-sub">—</span>
      </div>
      <div class="money-block">
        <span class="money-label">BTC price</span>
        <span class="money-value" id="price">—</span>
        <span class="money-sub" id="price-sub">Coinbase · BTC-USD</span>
      </div>
    </div>

    <div class="chart-wrap">
      <div class="chart-head">
        <div class="timeframes" id="timeframes">
          <button class="tf" data-mins="43200">1M</button>
          <button class="tf active" data-mins="129600">3M</button>
          <button class="tf" data-mins="259200">6M</button>
          <button class="tf" data-mins="525600">1Y</button>
          <button class="tf" data-mins="9999999">ALL</button>
        </div>
        <div class="legend">
          <span class="legend-item"><span class="swatch" style="background: #f4f4f5;"></span>BTC</span>
          <span class="legend-item"><span class="swatch" style="background: var(--shortEMA);"></span>fast EMA</span>
          <span class="legend-item"><span class="swatch" style="background: var(--longEMA);"></span>slow EMA</span>
          <span class="legend-item"><span class="swatch dot" style="background: var(--buy);"></span>BUY</span>
          <span class="legend-item"><span class="swatch dot" style="background: var(--sell);"></span>SELL</span>
        </div>
      </div>
      <canvas id="chart"></canvas>
    </div>

    <div class="footer">
      <div>strategy: <b id="strategy-name">TSMOM</b> · data: <b>Coinbase · daily bars</b> · <b id="poll-label">hourly</b></div>
      <div>ticks: <b id="tick-count">—</b> · trades: <b id="trade-count">—</b> · last: <b id="last-tick-time">—</b> · <b class="ok" id="status">live</b></div>
    </div>

  </div>

  <script>
    const POLL_MS = 5000;
    let BOT_POLL_S = 3600;   // updated from state.poll_seconds (daily strategy)
    let lastSeenTs = null;
    let windowMins = 129600;   // currently-selected chart timeframe (minutes); default 3M
    let latestData = null;     // last API payload, for instant re-render on tf change

    const fmtUsd = (n) => n == null ? "—" : "$" + Number(n).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
    const fmtPct = (n) => (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
    const fmtTime = (iso) => new Date(iso).toLocaleTimeString();

    async function refresh() {
      try {
        const r = await fetch("/api/state");
        const data = await r.json();
        render(data);
      } catch (e) {
        document.getElementById("status").textContent = "offline";
        document.getElementById("status").className = "";
      }
    }

    function render(data) {
      latestData = data;
      const s = data.state;
      if (!s) {
        document.getElementById("status").textContent = "starting…";
        return;
      }

      // Money strip
      document.getElementById("equity").textContent = fmtUsd(s.equity);
      const pnl = ((s.equity - s.starting_cash) / s.starting_cash) * 100;
      const ed = document.getElementById("equity-delta");
      ed.textContent = "since start " + fmtPct(pnl) + "  ·  " + ((s.equity - s.starting_cash) >= 0 ? "+" : "") + fmtUsd(s.equity - s.starting_cash);
      ed.className = "money-sub " + (pnl >= 0 ? "pos" : "neg");

      document.getElementById("cash").textContent = fmtUsd(s.cash);
      document.getElementById("cash-sub").textContent = s.has_position ? "deployed in BTC" : "all in cash";

      document.getElementById("position").textContent = s.has_position ? "Open" : "Flat";
      document.getElementById("position-sub").textContent = s.has_position
        ? `${s.position_qty.toFixed(6)} BTC worth ${fmtUsd(s.position_value)}`
        : "no open position";

      document.getElementById("price").textContent = fmtUsd(s.price);

      // Trend-strength badge (TSMOM: fraction of momentum horizons trending up)
      if (s.poll_seconds) BOT_POLL_S = s.poll_seconds;
      const sb = document.getElementById("signal-badge");
      if (s.mom_frac != null) {
        const pct = Math.round(s.mom_frac * 100);
        sb.textContent = "TREND " + pct + "% UP";
        sb.className = "badge signal-" + (pct >= 60 ? "buy" : pct < 40 ? "sell" : "hold");
      } else {
        sb.textContent = s.signal.toUpperCase();
        sb.className = "badge signal-" + s.signal;
      }

      // Footer
      if (s.strategy) document.getElementById("strategy-name").textContent = s.strategy.toUpperCase();
      if (s.poll_seconds) document.getElementById("poll-label").textContent =
        s.poll_seconds >= 3600 ? (s.poll_seconds / 3600) + "h checks" : Math.round(s.poll_seconds / 60) + "m checks";
      document.getElementById("tick-count").textContent = data.ticks.length;
      document.getElementById("trade-count").textContent = data.trades.length;
      document.getElementById("last-tick-time").textContent = fmtTime(s.ts);
      document.getElementById("status").textContent = "live";
      document.getElementById("status").className = "ok";
      lastSeenTs = s.ts;

      drawChart(data.ticks, data.trades);
    }

    function filterByWindow(ticks, trades, mins) {
      if (!ticks || !ticks.length) return { ticks: [], trades: trades || [] };
      const latest = new Date(ticks[ticks.length - 1].ts).getTime();
      const cutoff = latest - mins * 60 * 1000;
      const fticks = ticks.filter(t => new Date(t.ts).getTime() >= cutoff);
      const ftrades = (trades || []).filter(t => new Date(t.ts).getTime() >= cutoff);
      return { ticks: fticks, trades: ftrades };
    }

    function drawChart(allTicks, allTrades) {
      const { ticks, trades } = filterByWindow(allTicks, allTrades, windowMins);
      drawChartCore(ticks, trades);
    }

    function drawChartCore(ticks, trades) {
      const c = document.getElementById("chart");
      const ctx = c.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      const w = c.clientWidth, h = c.clientHeight;
      c.width = w * dpr; c.height = h * dpr;
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, w, h);

      if (!ticks || ticks.length < 2) {
        ctx.fillStyle = "#5a6573";
        ctx.font = "14px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Collecting daily history…", w / 2, h / 2);
        return;
      }

      const series = ticks.filter(t => t.price > 0);
      const prices = series.map(t => t.price);
      const shortEma = series.map(t => t.short_ma);
      const longEma  = series.map(t => t.long_ma);
      const validS = shortEma.filter(v => v > 0);
      const validL = longEma.filter(v => v > 0);
      const all = [...prices, ...validS, ...validL];
      const min = Math.min(...all) * 0.999;
      const max = Math.max(...all) * 1.001;
      const range = max - min || 1;

      const PAD_L = 12, PAD_R = 64, PAD_T = 8, PAD_B = 28;
      const plotW = w - PAD_L - PAD_R;
      const plotH = h - PAD_T - PAD_B;

      // Y-axis grid + labels
      ctx.fillStyle = "#5a6573";
      ctx.font = "10px -apple-system, sans-serif";
      ctx.textAlign = "left";
      const gridRows = 5;
      for (let i = 0; i <= gridRows; i++) {
        const v = min + (range * i / gridRows);
        const y = PAD_T + plotH - (i / gridRows) * plotH;
        ctx.strokeStyle = "rgba(36, 42, 50, 0.6)";
        ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(PAD_L, y); ctx.lineTo(w - PAD_R, y); ctx.stroke();
        ctx.fillText("$" + Math.round(v).toLocaleString(), w - PAD_R + 6, y + 3);
      }

      // Time domain: the x-axis represents the FULL selected window (e.g. 1d =
      // the last 24h), so every point and trade sits at its true time instead of
      // being stretched evenly across the width by sample index. Data younger
      // than the window simply leaves blank space on the left.
      const times = series.map(t => new Date(t.ts).getTime());
      const tEnd = times[times.length - 1];
      const tStart = tEnd - windowMins * 60 * 1000;
      const span = (tEnd - tStart) || 1;

      const x = (ms) => PAD_L + ((ms - tStart) / span) * plotW;
      const y = (v) => PAD_T + plotH - ((v - min) / range) * plotH;

      // X-axis time labels, evenly spaced across the real time window
      ctx.textAlign = "center";
      ctx.fillStyle = "#5a6573";
      const showDate = windowMins >= 1440;
      const xMarks = 4;
      for (let i = 0; i <= xMarks; i++) {
        const ms = tStart + (span * i) / xMarks;
        const t = new Date(ms);
        const label = showDate
          ? t.toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"})
          : t.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
        ctx.fillText(label, PAD_L + (i / xMarks) * plotW, h - 10);
      }

      function line(arr, color, lw) {
        ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath();
        let started = false;
        arr.forEach((v, i) => {
          if (v == null || !isFinite(v) || v <= 0) return;
          if (!started) { ctx.moveTo(x(times[i]), y(v)); started = true; }
          else ctx.lineTo(x(times[i]), y(v));
        });
        ctx.stroke();
      }
      line(prices,  "#e8edf2", 1.5);
      line(shortEma, "#ff6b00", 2);
      line(longEma,  "#00d9ff", 2);

      // Buy/sell markers placed at their true time within the window.
      if (trades && trades.length) {
        for (const tr of trades) {
          const tms = new Date(tr.ts).getTime();
          if (tms < tStart || tms > tEnd) continue;
          const px = x(tms);
          const py = y(tr.price);
          const color = tr.side === "buy" ? "#4ade80" : "#f87171";
          const label = tr.side === "buy" ? "BUY" : "SELL";

          // halo
          ctx.fillStyle = color + "33";
          ctx.beginPath(); ctx.arc(px, py, 16, 0, Math.PI * 2); ctx.fill();
          // dot
          ctx.fillStyle = color;
          ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#0b0d10"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.stroke();

          // label above/below
          ctx.fillStyle = color;
          ctx.font = "bold 11px -apple-system, sans-serif";
          ctx.textAlign = "center";
          const labelY = tr.side === "buy" ? py + 26 : py - 14;
          ctx.fillText(label, px, labelY);
          ctx.font = "10px -apple-system, sans-serif";
          ctx.fillStyle = "#8a96a3";
          ctx.fillText("$" + tr.price.toFixed(0), px, labelY + 11);
        }
      }
    }

    function updateCountdown() {
      if (!lastSeenTs) {
        document.getElementById("countdown").textContent = "next check in —";
        return;
      }
      const elapsed = (Date.now() - new Date(lastSeenTs).getTime()) / 1000;
      const remaining = Math.max(0, BOT_POLL_S - elapsed);
      const txt = remaining >= 90 ? `${Math.ceil(remaining / 60)}m` : `${Math.ceil(remaining)}s`;
      document.getElementById("countdown").textContent = `next check in ${txt}`;
    }

    // Timeframe buttons
    document.querySelectorAll(".tf").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tf").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        windowMins = parseInt(btn.dataset.mins, 10);
        if (latestData) drawChart(latestData.ticks, latestData.trades);
      });
    });

    window.addEventListener("resize", () => { if (latestData) drawChart(latestData.ticks, latestData.trades); });
    refresh();
    setInterval(refresh, POLL_MS);
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
